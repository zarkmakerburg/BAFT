name: Aurora x Core isolated merge preflight

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/aurora-core-preflight.yml'
      - 'web/aurora/**'
      - 'internal/bcc/**'

permissions:
  contents: read

jobs:
  three-way:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Three-way merge probe (no push)
        shell: bash
        run: |
          set -euo pipefail
          incoming=86cb4317fbab16e71208f701851b70140e380e84
          git fetch --no-tags origin "$incoming"
          git merge-base --is-ancestor 9bc830241fa2531199ed7cb697149b953217e722 HEAD
          git config user.name "BAFT Aurora preflight"
          git config user.email "aurora-preflight@users.noreply.github.com"
          if git merge --no-commit --no-ff "$incoming"; then
            echo "AURORA_CORE_TEXT_MERGE=CLEAN"
          else
            echo "AURORA_CORE_TEXT_MERGE=CONFLICT"
            git status --short
            git ls-files -u
            echo "::error::Aurora x Core needs reviewed conflict resolution"
            exit 1
          fi
          git diff --cached --check
          test -f web/aurora/src/shell.ts
          test -f internal/incidentclass/tracker.go
          grep -q 'TunnelVerification' internal/bcc/store.go
          echo "AURORA_CORE_TREE_SHA=$(git write-tree)"
          echo "Source merge only; browser/RTL/dark-light/visual parity NOT certified."
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.2'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Combined Aurora source and parity tests
        run: |
          npm --prefix web/aurora ci --ignore-scripts --no-audit --no-fund
          npm --prefix web/aurora test
      - name: Combined Core BCC and incident tests
        run: |
          go test ./internal/bcc ./internal/incidentclass -count=1
      - name: Classic BCC UI regression
        run: node --test web/tests/*.test.cjs
