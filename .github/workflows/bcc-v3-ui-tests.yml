name: BCC UI tests
on:
  pull_request:
    paths:
      - 'web/**'
      - 'internal/bcc/dashboard.go'
      - 'internal/bcc/countries.go'
      - '.github/workflows/bcc-v3-ui-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          for f in web/bcc-*.js web/qa/*.cjs web/tests/*.test.cjs; do node --check "$f"; done
      - name: UI tests
        run: node --test web/tests/*.test.cjs
      - name: Install locked Aurora build tool (no lifecycle scripts)
        run: npm --prefix web/aurora ci --ignore-scripts --no-audit --no-fund
      - name: Aurora strict contracts, generated assets and provider tests
        run: npm --prefix web/aurora test
