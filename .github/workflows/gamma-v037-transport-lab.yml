name: Gamma v0.3.7 Tunnel Transport Upgrade LAB
on:
  pull_request:
    paths:
      - 'tests/e2e/gamma_two_node_namespace.sh'
      - '.github/workflows/gamma-v037-transport-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy-to-candidate-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build pinned v0.3.7 and candidate EX/IR binaries in disposable LAB
        run: |
          set -euo pipefail
          old_sha="$(git rev-parse 'v0.3.7^{commit}')"
          test "$old_sha" = '94c55dccf5af7cd126089374d991463931413121'
          mkdir -p "$RUNNER_TEMP/baft-v037" "$RUNNER_TEMP/baft-current"
          git worktree add --detach "$RUNNER_TEMP/baft-v037-src" "$old_sha"
          go -C "$RUNNER_TEMP/baft-v037-src" build -o "$RUNNER_TEMP/baft-v037/" ./cmd/baft ./cmd/baft-pair
          go build -o "$RUNNER_TEMP/baft-current/" ./cmd/baft ./cmd/baft-pair
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables iproute2
          bash -n tests/e2e/gamma_two_node_namespace.sh
      - name: Verify old-to-new tunnel recovery without PairCode or key regeneration
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 300s sudo env GAMMA_INITIAL_BIN_DIR="$RUNNER_TEMP/baft-v037" \
            bash tests/e2e/gamma_two_node_namespace.sh "$RUNNER_TEMP/baft-current"
