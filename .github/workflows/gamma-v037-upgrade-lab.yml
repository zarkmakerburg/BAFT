name: Gamma v0.3.7 Upgrade Rollback LAB
on:
  pull_request:
    paths:
      - 'tests/e2e/gamma_v037_upgrade_rollback.sh'
      - '.github/workflows/gamma-v037-upgrade-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upgrade-rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify release gate rejects missing v0.3.7 upgrade evidence
        run: |
          set -euo pipefail
          go test ./tests/release -run '^TestGammaTaggedReleaseRequiresV037UpgradeLAB
        run: |
          set -euo pipefail
          bash -n tests/e2e/gamma_v037_upgrade_rollback.sh
          timeout --signal=TERM --kill-after=10s 900s bash tests/e2e/gamma_v037_upgrade_rollback.sh
 -count=1 -timeout=5m
      - name: Validate and execute disposable v0.3.7 BCC upgrade rollback
        run: |
          set -euo pipefail
          bash -n tests/e2e/gamma_v037_upgrade_rollback.sh
          timeout --signal=TERM --kill-after=10s 900s bash tests/e2e/gamma_v037_upgrade_rollback.sh
