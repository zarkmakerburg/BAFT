name: Guided tunnel flow E2E
# The v0.5.0 product path on one exact commit: the Quick Tunnel wizard's API
# sequence (truthful ingress capability -> connection test -> auto-select ->
# reviewed plan -> deploy -> ready -> client traffic -> decommission) against
# a real BCC and two agents installed from a signed release of the commit.
# One throwaway host plays both servers; this is not a multi-host or
# physical LAB result. mode=host runs the same path with ADR-003 safe host
# mode on the IR (install.sh --enable-host-ingress): owned public port,
# independent BCC probe, client traffic via the public port, exact retire and
# an Xray-claimed port refused.
on:
  pull_request:
  push:
    branches: ['main', 'qa/**', 'claude/**', 'agent-*/**', 'codex/v0.5.0-**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guided-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [manual, host]
    name: guided-flow (${{ matrix.mode }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Install nftables
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables
      - name: Build a signed release of this commit with throwaway keys
        run: scripts/release/local_release.sh "$RUNNER_TEMP/rel" v0.0.2-ci
      - name: Guided tunnel flow on real installed agents
        run: |
          set -o pipefail
          sudo env GITHUB_ACTIONS=true GF_MODE=${{ matrix.mode }} PATH="$PATH" tests/e2e/guided_flow.sh "$RUNNER_TEMP/rel" 2>&1 | tee "$RUNNER_TEMP/guided-flow.log"
      - name: Report the end of the guided flow log
        if: failure()
        run: |
          grep -E '^\[guided\]|FAIL|error|Error|refused|denied' "$RUNNER_TEMP/guided-flow.log" | tail -n 9 | cut -c1-900 | sed 's/%/%25/g; s/^/::error title=guided-log::/'
          tail -n 1 "$RUNNER_TEMP/guided-flow.log" | cut -c1-900 | sed 's/%/%25/g; s/^/::error title=guided-last::/'
