name: r3.1-probabilistic-morphing

on:
  push:
    branches: [r3-record-shaping-safe, r3.1-probabilistic-morphing]
  pull_request:
    branches: [r3-record-shaping-safe, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r3:
    runs-on: ubuntu-latest
    # Includes complete correctness and race suites; keep BCC's durable
    # restart tests within the same package budget as the main workflow.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Complete correctness gate
        run: go test ./... -count=1
      - name: Statistical evidence and ECRL differential
        run: |
          go test ./internal/recordshape -run 'Statistics1000|StatisticalGate' -count=1 -v
          go test ./internal/recovery -run 'TestStage1DifferentialGenerated|TestEngine' -count=1 -v
      - name: Race and static analysis
        id: full_suite_race
        run: |
          set -o pipefail
          go test -race -count=1 -timeout=15m ./... 2>&1 | tee "$RUNNER_TEMP/go-race.log"
          go vet ./...
      - name: Report race failures
        if: failure() && steps.full_suite_race.outcome == 'failure'
        run: |
          grep -E -- '^(WARNING: DATA RACE|--- FAIL|FAIL|panic:)|_test\.go:[0-9]+:' "$RUNNER_TEMP/go-race.log" | head -40 |
            sed 's/%/%25/g; s/^/::error title=go test -race::/' || true
      - name: Bounded record parser fuzz smoke
        run: go test ./internal/recordshape -run '^$' -fuzz FuzzMorphingReadFrame -fuzztime=5s
      - name: Installer and builds
        run: |
          bash -n install.sh
          go build ./cmd/baft ./cmd/baft-pair
      - name: Package complete R3.1 source
        run: git archive --format=zip --output=baft-r3.1-pro.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baft-r3.1-pro
          path: baft-r3.1-pro.zip
          if-no-files-found: error
          retention-days: 14
