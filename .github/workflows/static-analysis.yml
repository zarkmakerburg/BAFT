name: static-analysis

# Security-oriented static analysis: staticcheck (correctness/bug patterns) and
# gosec (insecure-code patterns). Daily and on demand; a finding is a lead for a
# potential vulnerability to triage, not an automatic production change.
on:
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:
  pull_request:
  push:
    branches: [feat/zeroday-fuzz]

permissions:
  contents: read

jobs:
  gosec:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: gosec
        # Excluded rule classes were triaged in reports/SECURITY-STATIC-ANALYSIS.md:
        # G115 bounded integer conversions, G703 guarded/operator-local paths,
        # G101 env-var NAME literals, G122 root-installer chown. Every other
        # rule (injection, weak crypto, unsafe, etc.) stays blocking, so a new
        # finding fails this job. staticcheck returns once it supports go1.27.
        # gosec is built here with a pinned golang.org/x/tools: the x/tools that
        # ships with gosec cannot read the export data of Go >= 1.27.2
        # ("export data version 5 is greater than maximum supported version 4").
        run: |
          set -euo pipefail
          tooldir="$(mktemp -d)"
          (
            cd "$tooldir"
            go mod init gosecbuild
            # A blank import keeps `go mod tidy` from pruning gosec.
            printf 'package gosecbuild\n\nimport _ "github.com/securego/gosec/v2/cmd/gosec"\n' > tools.go
            go get github.com/securego/gosec/v2@v2.30.0 golang.org/x/tools@v0.52.0
            go mod tidy
            go build -o "$RUNNER_TEMP/gosec" github.com/securego/gosec/v2/cmd/gosec
          )
          "$RUNNER_TEMP/gosec" -exclude-dir=tests -exclude=G115,G703,G101,G122 -severity high ./...
